version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: devoptics_postgres
    environment:
      POSTGRES_USER: devoptics
      POSTGRES_PASSWORD: devoptics_pass
      POSTGRES_DB: devoptics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devoptics"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devoptics_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: devoptics_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: devoptics
      MONGO_INITDB_ROOT_PASSWORD: devoptics_pass
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  postgres_data:
  redis_data:
  mongodb_data: